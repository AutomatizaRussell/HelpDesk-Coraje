services:
  # Servicio de un disparo: aplica migraciones pendientes contra la base real
  # con coraje_migrator (dueño de core+helpdesk) y termina. `web` no arranca
  # hasta que este servicio termine con éxito — ver `depends_on` abajo.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL}

    networks:
      - coraje_net

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    # NODE_ENV, PORT, HOSTNAME y NEXT_TELEMETRY_DISABLED los fija la etapa
    # `runner` del Dockerfile, no este bloque (U28): Coolify convierte cada
    # clave literal de aquí en argumento de build, y con NODE_ENV avisaba en
    # cada despliegue de que se saltarían las devDependencies.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Identidad de empleados (specs/acceso-empleados.md, U3) — variables
      # nuevas en Coolify antes de este deploy, nunca al revés.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI}
      HELPDESK_TOKEN_ENCRYPTION_KEY: ${HELPDESK_TOKEN_ENCRYPTION_KEY}
      # Lista explícita de lo que web necesita. Coolify inyecta además las
      # variables que tiene definidas (comprobado el 01-oct-2026 con variables
      # que llegaban sin estar aquí), así que esta lista no las
      # crea: si una no existe en Coolify, aquí llega vacía.
      # env.contract.test.mts exige que cada variable que lee `src/` esté
      # declarada, para que la lista sea completa.
      # Adjuntos (U7): webhooks sesion, confirmar y descarga de HELPDESK - Adjuntos V1.
      N8N_ADJUNTOS_WEBHOOK_URL: ${N8N_ADJUNTOS_WEBHOOK_URL}
      N8N_ADJUNTOS_SECRET: ${N8N_ADJUNTOS_SECRET}
      # Correo desde el buzón sin dueño: invitaciones, códigos y escalamiento.
      N8N_PORTAL_MAIL_WEBHOOK_URL: ${N8N_PORTAL_MAIL_WEBHOOK_URL}
      N8N_PORTAL_MAIL_SECRET: ${N8N_PORTAL_MAIL_SECRET}
      # Escalamiento diario de avisos (U15): secreto de la ruta que llama n8n.
      HELPDESK_ESCALAR_AVISOS_SECRET: ${HELPDESK_ESCALAR_AVISOS_SECRET}
      # Entrada directa, sin pasar por Conecta (U20): https://helpdesk.rbgct.cloud.
      # Opcional: sin ella solo se entra por conecta.rbgct.cloud/helpdesk. Va al
      # final, cuando el DNS, el dominio en Coolify y la dirección de retorno
      # en Entra ya existen (operacion.md, «Entrada directa»).
      HELPDESK_DIRECT_ORIGIN: ${HELPDESK_DIRECT_ORIGIN:-}
      # Portal de clientes, consola de accesos y redirección (U8), desconectados
      # desde U20. Solo `true` los conecta; sin ella, sus rutas responden 404.
      PORTAL_CLIENTES_CONECTADO: ${PORTAL_CLIENTES_CONECTADO:-}

    expose:
      - "3000"

    networks:
      - coolify
      - coraje_net

networks:
  coolify:
    external: true

  coraje_net:
    external: true
