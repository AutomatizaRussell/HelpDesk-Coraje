services:
  # Servicio de un disparo: aplica migraciones pendientes contra la base real
  # con coraje_migrator (dueño de core+helpdesk) y termina. `web` no arranca
  # hasta que este servicio termine con éxito — ver `depends_on` abajo.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL}

    networks:
      - coraje_net

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Identidad de empleados (specs/acceso-empleados.md, U3) — variables
      # nuevas en Coolify antes de este deploy, nunca al revés.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI}
      HELPDESK_TOKEN_ENCRYPTION_KEY: ${HELPDESK_TOKEN_ENCRYPTION_KEY}
      # Lista explícita de lo que web necesita. Coolify inyecta además las
      # variables que tiene definidas (comprobado el 01-oct-2026: las de
      # N8N_OUTBOX_KICK_* llegaban sin estar aquí), así que esta lista no las
      # crea: si una no existe en Coolify, aquí llega vacía.
      # env.contract.test.mts exige que cada variable que lee `src/` esté
      # declarada, para que la lista sea completa.
      # Espejo en PowerApps (U9): despierta la salida de n8n en cada cambio.
      N8N_OUTBOX_KICK_URL: ${N8N_OUTBOX_KICK_URL}
      N8N_OUTBOX_KICK_SECRET: ${N8N_OUTBOX_KICK_SECRET}
      # Correo desde el buzón sin dueño: invitaciones, códigos y escalamiento.
      N8N_PORTAL_MAIL_WEBHOOK_URL: ${N8N_PORTAL_MAIL_WEBHOOK_URL}
      N8N_PORTAL_MAIL_SECRET: ${N8N_PORTAL_MAIL_SECRET}
      # Escalamiento diario de avisos (U15): secreto de la ruta que llama n8n.
      HELPDESK_ESCALAR_AVISOS_SECRET: ${HELPDESK_ESCALAR_AVISOS_SECRET}

    expose:
      - "3000"

    networks:
      - coolify
      - coraje_net

networks:
  coolify:
    external: true

  coraje_net:
    external: true
